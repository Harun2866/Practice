<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইন্টার্নাল সিএসএস উদাহরণ</title>
    
    <!-- ইন্টার্নাল সিএসএস শুরু -->
    <style>
        body {
            background-color: yellow;
        }

        h1 {
            font-size: 36pt;
        }

        h2 {
            color: blue;
        }

        p {
            margin-left: 50px;
        }
    </style>
    <!-- ইন্টার্নাল সিএসএস শেষ -->

</head>
<body>

    <h1>This header is 36 pt</h1>

    <h2>This header is blue</h2>

    <p>This paragraph has a left margin of 50 pixels</p>

</body>
</html>
