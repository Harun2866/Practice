<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নামাজের সময়সূচি</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'SolaimanLipi', Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .clock {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 85, 0.2);
        }

        .bismillah {
            font-size: 24px;
            color: #00ff55;
            margin-bottom: 15px;
        }

        .mosque-name {
            font-size: 30px;
            color: #00c8ff;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 20px;
            color: #ffaa00;
            margin-bottom: 15px;
        }

        .time {
            font-size: 55px;
            font-weight: bold;
            color: #00ff55;
            text-shadow: 0 0 10px #00ff55;
        }

        .date {
            font-size: 18px;
            color: #cccccc;
            margin: 10px 0 20px 0;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #00ff55;
            margin: 15px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .prayer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin: 5px 0;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .prayer-name {
            color: #00ff55;
            font-size: 22px;
            font-weight: bold;
        }

        .prayer-time {
            color: #ff3333;
            font-size: 27px;
            font-weight: bold;
            text-shadow: 0 0 8px red;
        }

        .footer {
            color: #00c8ff;
            border: 1px solid #008cff;
            padding: 12px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 18px;
        }

        @media (max-width: 380px) {
            .time {
                font-size: 48px;
            }

            .mosque-name {
                font-size: 26px;
            }

            .prayer-name {
                font-size: 18px;
            }

            .prayer-time {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="clock">

    <div class="bismillah">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </div>
  <p>Harun Or Rashid </p>

    <h1 class="mosque-name">হাকরইল জামে মসজিদ</h1>

    <div class="subtitle">
        নামাজের সময়সূচি
    </div>

    <div>
        <span class="time" id="clock">00:00:00</span>
    </div>

    <div class="date" id="date"></div>

    <div class="section-title">
        নামাজের সময়সূচি
    </div>

    <div class="prayer-row">
        <span class="prayer-name">ফজর</span>
        <span class="prayer-time">5:30 AM</span>
    </div>

    <div class="prayer-row">
        <span class="prayer-name">যোহর</span>
        <span class="prayer-time">1:00 PM</span>
    </div>

    <div class="prayer-row">
        <span class="prayer-name">আছর</span>
        <span class="prayer-time">3:30 PM</span>
    </div>

    <div class="prayer-row">
        <span class="prayer-name">মাগরিব</span>
        <span class="prayer-time">5:31 PM</span>
    </div>

    <div class="prayer-row">
        <span class="prayer-name">এশা</span>
        <span class="prayer-time">7:30 PM</span>
    </div>

    <div class="prayer-row">
        <span class="prayer-name">জুমা</span>
        <span class="prayer-time">1:00 PM</span>
    </div>

    <div class="prayer-row">
        <span class="prayer-name">সূর্যোদয়</span>
        <span class="prayer-time">5:00 AM</span>
    </div>

    <div class="prayer-row">
        <span class="prayer-name">সূর্যাস্ত</span>
        <span class="prayer-time">5:31 PM</span>
    </div>

    <div class="footer">
        আল্লাহর উপর ভরসা করুন
    </div>

</div>

<script>
function updateClock() {
    let now = new Date();

    let time = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Dhaka",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    }).format(now);

    let date = new Intl.DateTimeFormat("bn-BD", {
        timeZone: "Asia/Dhaka",
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    }).format(now);

    document.getElementById("clock").textContent = time;
    document.getElementById("date").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
